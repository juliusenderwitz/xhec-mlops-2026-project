[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "xhec-mlops-project-student"
version = "0.0.1"
authors = [
  { name = "im-on-gh", email = "karin.yamakawa@hec.edu" },
  { name = "chKenza", email = "kenza.chaabouni@hec.edu" },
  { name = "juliusenderwitz", email = "julius.enderwitz@hec.edu" },
  { name = "aaron3636", email = "carl.heimann@hec.edu" },
]
description = "X-HEC MLOps Project on Abalone age prediction model"
requires-python = ">=3.10,<3.12"

dependencies = [
    "pandas>=2.3.3",
    "pydantic>=2.9",
    "scikit-learn>=1.7.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["src/modelling"]
